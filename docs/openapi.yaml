openapi: 3.1.0
info:
  title: HIS Enterprise API
  version: 0.2.0
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
  /api/enterprise/bed-board:
    get:
      summary: Real-time bed occupancy and ward capacity
      responses:
        "200":
          description: Bed board summary
  /api/enterprise/fhir/patient/{id}:
    get:
      summary: FHIR Patient representation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: FHIR Patient resource
  /api/enterprise/offline/sync:
    post:
      summary: Offline-first operation sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId:
                  type: string
                lastSyncToken:
                  type: string
                operations:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Sync acknowledgement
  /api/smart/decision-support:
    post:
      summary: AI decision support risk scoring
      responses:
        "200":
          description: Clinical recommendations and risk score
  /api/smart/integrity-chain/anchor:
    post:
      summary: Anchor a patient record or prescription hash
      responses:
        "201":
          description: Integrity ledger anchor

