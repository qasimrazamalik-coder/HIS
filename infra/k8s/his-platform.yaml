apiVersion: v1
kind: Namespace
metadata:
  name: his
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: his-api
  namespace: his
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: his-api
  template:
    metadata:
      labels:
        app: his-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/his-api:latest
          ports:
            - containerPort: 4000
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
          envFrom:
            - secretRef:
                name: his-api-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: his-api
  namespace: his
spec:
  selector:
    app: his-api
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: his-api-hpa
  namespace: his
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: his-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: his-web
  namespace: his
spec:
  replicas: 2
  selector:
    matchLabels:
      app: his-web
  template:
    metadata:
      labels:
        app: his-web
    spec:
      containers:
        - name: web
          image: ghcr.io/example/his-web:latest
          ports:
            - containerPort: 5173
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: his-web
  namespace: his
spec:
  selector:
    app: his-web
  ports:
    - port: 80
      targetPort: 5173
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: his-ingress
  namespace: his
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  rules:
    - host: his.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: his-api
                port:
                  number: 4000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: his-api
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: his-web
                port:
                  number: 80

