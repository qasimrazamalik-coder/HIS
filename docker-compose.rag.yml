services:
  rag-api:
    build:
      context: .
      dockerfile: services/rag-api/Dockerfile
    environment:
      RAG_JWT_SECRET: replace-with-32-plus-random-bytes
      RAG_ADMIN_EMAIL: admin@example.com
      RAG_ADMIN_PASSWORD: admin12345
      RAG_USER_EMAIL: user@example.com
      RAG_USER_PASSWORD: user12345
      RAG_EMBEDDING_PROVIDER: local
      RAG_LLM_PROVIDER: local
      RAG_CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
    ports:
      - "8100:8100"
    volumes:
      - rag_data:/app/data

  rag-web:
    build:
      context: .
      dockerfile: apps/rag-web/Dockerfile
    environment:
      VITE_RAG_API_URL: http://localhost:8100
    ports:
      - "5174:5174"
    depends_on:
      - rag-api

volumes:
  rag_data:

